<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>404 — placeholder</title>
    <!--
      GitHub Pages SPA 重定向（spa-github-pages 方案）。
      用户站点为根部署，pathSegmentsToKeep = 0。
      把被直接访问/刷新的路径编码进 query，跳回 index.html，
      由 index.html 的还原脚本用 history.replaceState 复原真实路径。
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      );
    </script>
  </head>
  <body>
    404 — placeholder, redirecting…
  </body>
</html>
