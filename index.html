<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>王二的博客</title>
    <meta name="description" content="（待完善）王二的个人博客 — 描述 placeholder" />

    <!-- Open Graph（基础占位；按文章的社媒预览需后续预渲染） -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="王二的博客" />
    <meta property="og:description" content="（待完善）王二的个人博客 — 描述 placeholder" />
    <meta property="og:url" content="https://10knamesmore.github.io/" />

    <!-- SPA 路径还原：配合 public/404.html 的 spa-github-pages 重定向 -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
